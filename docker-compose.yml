version: '3'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./saved_models:/app/saved_models
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DEBUG=True
    command: >
      flask run --host=0.0.0.0 --port=5000
    restart: unless-stopped